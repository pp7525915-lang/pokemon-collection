<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ Dex Go</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#202b45,#344f87);
  color:white;
  padding:20px 16px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:6px 0 0;
  opacity:.9;
}

nav{
  display:flex;
  gap:8px;
  padding:10px;
  background:white;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

nav button{
  flex:1;
  border:0;
  padding:12px 6px;
  border-radius:10px;
  background:#e8edf6;
  font-size:14px;
  font-weight:bold;
}

nav button.active{
  background:#344f87;
  color:white;
}

main{
  max-width:800px;
  margin:auto;
  padding:16px;
}

section{
  display:none;
}

section.active{
  display:block;
}

.card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.card h2{
  margin-top:0;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.stat{
  background:white;
  padding:18px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.stat-number{
  font-size:26px;
  font-weight:bold;
  color:#344f87;
}

.stat-label{
  font-size:13px;
  margin-top:4px;
}

label{
  display:block;
  font-weight:bold;
  margin-top:14px;
  margin-bottom:6px;
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #ccd3df;
  border-radius:10px;
  font-size:15px;
  background:white;
}

input:focus,
select:focus{
  outline:none;
  border-color:#344f87;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

button.primary{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#344f87;
  color:white;
  font-size:16px;
  font-weight:bold;
}

button.secondary{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:0;
  border-radius:10px;
  background:#e8edf6;
  font-weight:bold;
}

.pokemon-option{
  padding:10px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.pokemon-option:last-child{
  border-bottom:0;
}

.pokemon-option:hover{
  background:#f1f4fa;
}

#pokemonResults{
  max-height:220px;
  overflow-y:auto;
  border:1px solid #ccd3df;
  border-radius:10px;
  margin-top:6px;
  background:white;
}

.hidden{
  display:none!important;
}

.selected-pokemon{
  background:#eef3ff;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
  font-weight:bold;
}

.iv-box{
  background:#f5f7fb;
  padding:12px;
  border-radius:12px;
  margin-top:14px;
}

.iv-percent{
  font-size:22px;
  font-weight:bold;
  text-align:center;
  color:#344f87;
  margin-top:10px;
}

.collection-item{
  background:white;
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.collection-title{
  font-size:18px;
  font-weight:bold;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:8px;
}

.badge{
  background:#e8edf6;
  padding:5px 8px;
  border-radius:20px;
  font-size:11px;
}

.empty{
  text-align:center;
  padding:30px 10px;
  color:#687386;
}

.small{
  font-size:12px;
  color:#687386;
  margin-top:5px;
}

@media(max-width:500px){
  .row{
    grid-template-columns:1fr;
  }

  header h1{
    font-size:26px;
  }
}
</style>
</head>

<body>

<header>
  <h1>⚡ Dex Go</h1>
  <p>My Pokémon GO Collection</p>
</header>

<nav>
  <button id="homeBtn" class="active" onclick="showSection('home')">
    🏠 Home
  </button>

  <button id="addBtn" onclick="showSection('add')">
    ➕ Add
  </button>

  <button id="collectionBtn" onclick="showSection('collection')">
    📦 Collection
  </button>
</nav>

<main>

<!-- HOME -->
<section id="home" class="active">

  <div class="card">
    <h2>⚡ Welcome to Dex Go</h2>
    <p>Track your Pokémon GO collection.</p>
  </div>

  <div class="stats">

    <div class="stat">
      <div id="totalCount" class="stat-number">0</div>
      <div class="stat-label">Pokémon</div>
    </div>

    <div class="stat">
      <div id="shinyCount" class="stat-number">0</div>
      <div class="stat-label">✨ Shiny</div>
    </div>

    <div class="stat">
      <div id="hundoCount" class="stat-number">0</div>
      <div class="stat-label">💯 Hundo</div>
    </div>

    <div class="stat">
      <div id="luckyCount" class="stat-number">0</div>
      <div class="stat-label">🍀 Lucky</div>
    </div>

  </div>

</section>


<!-- ADD -->
<section id="add">

  <div class="card">

    <h2>➕ Add Pokémon</h2>

    <label>Search Pokémon</label>

    <input
      type="text"
      id="pokemonSearch"
      placeholder="Type Pokémon name..."
      autocomplete="off"
      oninput="filterPokemon()"
    >

    <div id="pokemonResults"></div>

    <div id="selectedPokemon" class="selected-pokemon hidden">
      Selected Pokémon
    </div>

    <label>Pokédex #</label>

    <input
      type="text"
      id="pokedexNumber"
      readonly
      placeholder="Automatically filled"
    >

    <label>CP</label>

    <input
      type="number"
      id="cp"
      min="0"
      placeholder="CP"
    >

    <label>HP</label>

    <input
      type="number"
      id="hp"
      min="0"
      placeholder="HP"
    >

    <div class="iv-box">

      <h3>🧮 IVs</h3>

      <div class="row">

        <div>
          <label>ATK IV</label>
          <input
            type="number"
            id="atkIV"
            min="0"
            max="15"
            step="1"
            value="0"
            oninput="limitIV(this); updateIV()"
          >
        </div>

        <div>
          <label>DEF IV</label>
          <input
            type="number"
            id="defIV"
            min="0"
            max="15"
            step="1"
            value="0"
            oninput="limitIV(this); updateIV()"
          >
        </div>

      </div>

      <label>HP IV</label>

      <input
        type="number"
        id="hpIV"
        min="0"
        max="15"
        step="1"
        value="0"
        oninput="limitIV(this); updateIV()"
      >

      <div id="ivPercent" class="iv-percent">
        IV: 0.0%
      </div>

    </div>


    <div class="card" style="margin-top:16px;background:#f7f9fc;box-shadow:none;">

      <h3>⚔️ Moveset</h3>

      <label>Fast Attack</label>

      <select id="fastAttack">
        <option value="">Select Fast Attack</option>
      </select>

      <label>Charged Attack 1</label>

      <select id="chargedAttack1">
        <option value="">Select Charged Attack</option>
      </select>

      <label>Charged Attack 2</label>

      <select id="chargedAttack2">
        <option value="">Select Charged Attack</option>
      </select>

      <div class="small">
        Moves are loaded from the selected Pokémon.
      </div>

    </div>


    <label>Special Attributes</label>

    <div class="row">

      <div>
        <label>Shiny</label>
        <select id="shiny">
          <option value="No">No</option>
          <option value="Yes">Yes</option>
        </select>
      </div>

      <div>
        <label>Lucky</label>
        <select id="lucky">
          <option value="No">No</option>
          <option value="Yes">Yes</option>
        </select>
      </div>

    </div>


    <div class="row">

      <div>
        <label>Hundo</label>
        <select id="hundo">
          <option value="No">No</option>
          <option value="Yes">Yes</option>
        </select>
      </div>

      <div>
        <label>Dynamax</label>
        <select id="dynamax">
          <option value="No">No</option>
          <option value="Yes">Yes</option>
        </select>
      </div>

    </div>


    <div class="row">

      <div>
        <label>Gigantamax</label>
        <select id="gigantamax">
          <option value="No">No</option>
          <option value="Yes">Yes</option>
        </select>
      </div>

      <div>
        <label>Shadow</label>
        <select id="shadow">
          <option value="No">No</option>
          <option value="Yes">Yes</option>
        </select>
      </div>

    </div>


    <label>Costume</label>

    <input
      type="text"
      id="costume"
      placeholder="Example: Party Hat"
    >


    <label>Event</label>

    <input
      type="text"
      id="event"
      placeholder="Example: Halloween 2026"
    >


    <label>Background</label>

    <input
      type="text"
      id="background"
      placeholder="Example: City Background"
    >


    <label>Rarity /10</label>

    <input
      type="number"
      id="rarity"
      min="0"
      max="10"
      step="1"
      value="0"
    >


    <button class="primary" onclick="savePokemon()">
      💾 Save Pokémon
    </button>

  </div>

</section>


<!-- COLLECTION -->
<section id="collection">

  <div class="card">

    <h2>📦 My Pokémon</h2>

    <div id="collectionList"></div>

  </div>

</section>

</main>


<script>

let pokemonList = [];
let selectedPokemon = null;


/* =========================
   NAVIGATION
========================= */

function showSection(section){

  document.querySelectorAll("section").forEach(function(sec){
    sec.classList.remove("active");
  });

  document.querySelectorAll("nav button").forEach(function(btn){
    btn.classList.remove("active");
  });

  document.getElementById(section).classList.add("active");

  if(section === "home"){
    document.getElementById("homeBtn").classList.add("active");
  }

  if(section === "add"){
    document.getElementById("addBtn").classList.add("active");
  }

  if(section === "collection"){
    document.getElementById("collectionBtn").classList.add("active");
    renderPokemon();
  }

}


/* =========================
   POKEMON LIST
========================= */

async function loadPokedex(){

  try{

    const response = await fetch(
      "https://pokeapi.co/api/v2/pokemon-species?limit=1025&offset=0"
    );

    const data = await response.json();

    pokemonList = data.results.map(function(pokemon,index){

      return {
        name: formatName(pokemon.name),
        id: index + 1,
        url: pokemon.url
      };

    });

  }catch(error){

    console.log("Pokédex loading error:",error);

  }

}


/* =========================
   FORMAT NAME
========================= */

function formatName(name){

  return name
    .split("-")
    .map(function(word){
      return word.charAt(0).toUpperCase() + word.slice(1);
    })
    .join(" ");

}


/* =========================
   SEARCH POKEMON
========================= */

function filterPokemon(){

  const search =
    document.getElementById("pokemonSearch").value
    .toLowerCase()
    .trim();

  const results =
    document.getElementById("pokemonResults");

  results.innerHTML = "";

  if(search === ""){

    results.classList.add("hidden");
    return;

  }

  const matches = pokemonList
    .filter(function(pokemon){

      return pokemon.name
        .toLowerCase()
        .includes(search);

    })
    .slice(0,30);


  if(matches.length === 0){

    results.innerHTML =
      '<div class="pokemon-option">No Pokémon found.</div>';

    results.classList.remove("hidden");

    return;

  }


  matches.forEach(function(pokemon){

    const div = document.createElement("div");

    div.className = "pokemon-option";

    div.textContent =
      "#" +
      String(pokemon.id).padStart(3,"0") +
      " " +
      pokemon.name;

    div.onclick = function(){

      selectPokemon(pokemon);

    };

    results.appendChild(div);

  });

  results.classList.remove("hidden");

}


/* =========================
   SELECT POKEMON
========================= */

async function selectPokemon(pokemon){

  selectedPokemon = pokemon;

  document.getElementById("pokemonSearch").value =
    pokemon.name;

  document.getElementById("pokedexNumber").value =
    "#" + String(pokemon.id).padStart(3,"0");

  const selected =
    document.getElementById("selectedPokemon");

  selected.textContent =
    "✅ Selected: #" +
    String(pokemon.id).padStart(3,"0") +
    " " +
    pokemon.name;

  selected.classList.remove("hidden");

  document
    .getElementById("pokemonResults")
    .classList.add("hidden");

  await loadMoves(pokemon.id);

}


/* =========================
   LOAD MOVES
========================= */

async function loadMoves(id){

  const fastAttack =
    document.getElementById("fastAttack");

  const chargedAttack1 =
    document.getElementById("chargedAttack1");

  const chargedAttack2 =
    document.getElementById("chargedAttack2");


  fastAttack.innerHTML =
    '<option value="">Loading moves...</option>';

  chargedAttack1.innerHTML =
    '<option value="">Loading moves...</option>';

  chargedAttack2.innerHTML =
    '<option value="">Loading moves...</option>';


  try{

    const response =
      await fetch(
        "https://pokeapi.co/api/v2/pokemon/" + id
      );

    const data = await response.json();

    const moves = data.moves.map(function(move){

      return formatName(
        move.move.name
      );

    });


    const uniqueMoves =
      [...new Set(moves)]
      .sort();


    fillMoveSelect(
      fastAttack,
      uniqueMoves
    );

    fillMoveSelect(
      chargedAttack1,
      uniqueMoves
    );

    fillMoveSelect(
      chargedAttack2,
      uniqueMoves
    );


  }catch(error){

    fastAttack.innerHTML =
      '<option value="">Moves unavailable</option>';

    chargedAttack1.innerHTML =
      '<option value="">Moves unavailable</option>';

    chargedAttack2.innerHTML =
      '<option value="">Moves unavailable</option>';

    console.log("Move loading error:",error);

  }

}


/* =========================
   FILL MOVE SELECT
========================= */

function fillMoveSelect(select,moves){

  select.innerHTML =
    '<option value="">Select Move</option>';

  moves.forEach(function(move){

    const option =
      document.createElement("option");

    option.value = move;
    option.textContent = move;

    select.appendChild(option);

  });

}


/* =========================
   IV LIMIT
========================= */

function limitIV(input){

  let value =
    parseInt(input.value);

  if(isNaN(value)){
    input.value = 0;
    return;
  }

  if(value < 0){
    input.value = 0;
  }

  if(value > 15){
    input.value = 15;
  }

}


/* =========================
   IV CALCULATOR
========================= */

function updateIV(){

  let atk =
    parseInt(document.getElementById("atkIV").value) || 0;

  let def =
    parseInt(document.getElementById("defIV").value) || 0;

  let hp =
    parseInt(document.getElementById("hpIV").value) || 0;


  atk = Math.max(0,Math.min(15,atk));
  def = Math.max(0,Math.min(15,def));
  hp = Math.max(0,Math.min(15,hp));


  const total =
    atk + def + hp;

  const percent =
    (total / 45) * 100;


  document.getElementById("ivPercent").textContent =
    "IV: " + percent.toFixed(1) + "%";


  if(
    atk === 15 &&
    def === 15 &&
    hp === 15
  ){

    document.getElementById("hundo").value = "Yes";

  }

}


/* =========================
   SAVE POKEMON
========================= */

function savePokemon(){

  if(!selectedPokemon){

    alert("Please select a Pokémon first.");

    return;

  }


  const atk =
    Math.max(
      0,
      Math.min(
        15,
        parseInt(
          document.getElementById("atkIV").value
        ) || 0
      )
    );


  const def =
    Math.max(
      0,
      Math.min(
        15,
        parseInt(
          document.getElementById("defIV").value
        ) || 0
      )
    );


  const hpIV =
    Math.max(
      0,
      Math.min(
        15,
        parseInt(
          document.getElementById("hpIV").value
        ) || 0
      )
    );


  const pokemon = {

    id: Date.now(),

    name: selectedPokemon.name,

    pokedex:
      selectedPokemon.id,

    cp:
      document.getElementById("cp").value,

    hp:
      document.getElementById("hp").value,

    atkIV: atk,

    defIV: def,

    hpIV: hpIV,

    ivPercent:
      ((atk + def + hpIV) / 45 * 100)
        .toFixed(1),

    fastAttack:
      document.getElementById("fastAttack").value,

    chargedAttack1:
      document.getElementById("chargedAttack1").value,

    chargedAttack2:
      document.getElementById("chargedAttack2").value,

    shiny:
      document.getElementById("shiny").value,

    lucky:
      document.getElementById("lucky").value,

    hundo:
      document.getElementById("hundo").value,

    dynamax:
      document.getElementById("dynamax").value,

    gigantamax:
      document.getElementById("gigantamax").value,

    shadow:
      document.getElementById("shadow").value,

    costume:
      document.getElementById("costume").value,

    event:
      document.getElementById("event").value,

    background:
      document.getElementById("background").value,

    rarity:
      document.getElementById("rarity").value

  };


  let collection =
    JSON.parse(
      localStorage.getItem("dexGoCollection")
    ) || [];


  collection.push(pokemon);


  localStorage.setItem(
    "dexGoCollection",
    JSON.stringify(collection)
  );


  alert("✅ Pokémon saved!");


  updateStats();

  renderPokemon();

  resetForm();

  showSection("collection");

}


/* =========================
   RESET FORM
========================= */

function resetForm(){

  selectedPokemon = null;

  document.getElementById("pokemonSearch").value = "";

  document.getElementById("pokedexNumber").value = "";

  document.getElementById("selectedPokemon").classList.add("hidden");

  document.getElementById("cp").value = "";

  document.getElementById("hp").value = "";

  document.getElementById("atkIV").value = 0;

  document.getElementById("defIV").value = 0;

  document.getElementById("hpIV").value = 0;

  document.getElementById("fastAttack").innerHTML =
    '<option value="">Select Fast Attack</option>';

  document.getElementById("chargedAttack1").innerHTML =
    '<option value="">Select Charged Attack</option>';

  document.getElementById("chargedAttack2").innerHTML =
    '<option value="">Select Charged Attack</option>';

  document.getElementById("shiny").value = "No";

  document.getElementById("lucky").value = "No";

  document.getElementById("hundo").value = "No";

  document.getElementById("dynamax").value = "No";

  document.getElementById("gigantamax").value = "No";

  document.getElementById("shadow").value = "No";

  document.getElementById("costume").value = "";

  document.getElementById("event").value = "";

  document.getElementById("background").value = "";

  document.getElementById("rarity").value = 0;

  updateIV();

}


/* =========================
   RENDER COLLECTION
========================= */

function renderPokemon(){

  const list =
    document.getElementById("collectionList");

  const collection =
    JSON.parse(
      localStorage.getItem("dexGoCollection")
    ) || [];


  if(collection.length === 0){

    list.innerHTML =
      '<div class="empty">No Pokémon saved yet.</div>';

    return;

  }


  list.innerHTML = "";


  collection
    .slice()
    .reverse()
    .forEach(function(pokemon){

      const item =
        document.createElement("div");

      item.className =
        "collection-item";


      const title =
        document.createElement("div");

      title.className =
        "collection-title";

      title.textContent =
        "#" +
        String(pokemon.pokedex)
          .padStart(3,"0") +
        " " +
        pokemon.name;


      item.appendChild(title);


      const details =
        document.createElement("div");

      details.className =
        "small";

      details.innerHTML =
        "CP: " +
        (pokemon.cp || "-") +
        " | HP: " +
        (pokemon.hp || "-") +
        "<br>" +
        "IV: " +
        pokemon.ivPercent +
        "%";


      item.appendChild(details);


      const badges =
        document.createElement("div");
            badges.className =
        "badges";


      addBadge(
        badges,
        "⚔️ " +
        (pokemon.fastAttack || "No Fast Attack")
      );


      addBadge(
        badges,
        "⚡ " +
        (pokemon.chargedAttack1 || "No Charged Attack")
      );


      if(pokemon.chargedAttack2){

        addBadge(
          badges,
          "⚡ " +
          pokemon.chargedAttack2
        );

      }


      if(pokemon.shiny === "Yes"){
        addBadge(badges,"✨ Shiny");
      }

      if(pokemon.lucky === "Yes"){
        addBadge(badges,"🍀 Lucky");
      }

      if(pokemon.hundo === "Yes"){
        addBadge(badges,"💯 Hundo");
      }

      if(pokemon.dynamax === "Yes"){
        addBadge(badges,"💪 Dynamax");
      }

      if(pokemon.gigantamax === "Yes"){
        addBadge(badges,"🌟 Gigantamax");
      }

      if(pokemon.shadow === "Yes"){
        addBadge(badges,"🌑 Shadow");
      }

      if(pokemon.costume){
        addBadge(
          badges,
          "👕 " + pokemon.costume
        );
      }

      if(pokemon.event){
        addBadge(
          badges,
          "🎉 " + pokemon.event
        );
      }

      if(pokemon.background){
        addBadge(
          badges,
          "🌄 " + pokemon.background
        );
      }


      item.appendChild(badges);


      list.appendChild(item);

    });

}


/* =========================
   ADD BADGE
========================= */

function addBadge(container,text){

  const badge =
    document.createElement("span");

  badge.className = "badge";

  badge.textContent = text;

  container.appendChild(badge);

}


/* =========================
   STATS
========================= */

function updateStats(){

  const collection =
    JSON.parse(
      localStorage.getItem("dexGoCollection")
    ) || [];


  document.getElementById("totalCount")
    .textContent = collection.length;


  document.getElementById("shinyCount")
    .textContent =
      collection.filter(function(p){
        return p.shiny === "Yes";
      }).length;


  document.getElementById("hundoCount")
    .textContent =
      collection.filter(function(p){
        return p.hundo === "Yes";
      }).length;


  document.getElementById("luckyCount")
    .textContent =
      collection.filter(function(p){
        return p.lucky === "Yes";
      }).length;

}


/* =========================
   START APP
========================= */

updateStats();

renderPokemon();

loadPokedex();

updateIV();

</script>
