<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dex Go</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f4f8;
  color: #222;
}

header {
  background: #111827;
  color: white;
  text-align: center;
  padding: 18px;
  font-size: 28px;
  font-weight: bold;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 15px;
}

.nav {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 15px;
}

.nav button {
  border: 0;
  border-radius: 10px;
  padding: 13px 5px;
  font-size: 14px;
  font-weight: bold;
  background: #e5e7eb;
  cursor: pointer;
}

.nav button.active {
  background: #2563eb;
  color: white;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 3px 10px rgba(0,0,0,.08);
}

.hidden {
  display: none !important;
}

.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.stat {
  background: #eef2ff;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
}

.stat-number {
  font-size: 25px;
  font-weight: bold;
}

.stat-label {
  font-size: 13px;
  margin-top: 5px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 10px;
  padding: 13px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 8px;
}

.primary {
  background: #2563eb;
  color: white;
}

.success {
  background: #16a34a;
  color: white;
}

.secondary {
  background: #e5e7eb;
  color: #111827;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 12px;
}

input,
select {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  font-size: 16px;
  background: white;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.iv-box {
  background: #ecfdf5;
  border: 1px solid #86efac;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
  margin-top: 12px;
}

.iv-title {
  color: #166534;
  font-size: 14px;
}

.iv-value {
  color: #15803d;
  font-size: 30px;
  font-weight: bold;
  margin-top: 4px;
}

.checkbox-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
}

.checkbox-item {
  background: #f3f4f6;
  border-radius: 9px;
  padding: 10px;
}

.checkbox-item label {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  font-weight: normal;
}

.checkbox-item input {
  width: auto;
  margin: 0;
}

.status {
  text-align: center;
  color: #6b7280;
  padding: 10px;
  font-size: 14px;
}

.pokemon-card {
  background: #f9fafb;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 15px;
  margin-top: 10px;
}

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.badge {
  background: #e5e7eb;
  border-radius: 20px;
  padding: 5px 9px;
  font-size: 12px;
}

.small {
  color: #6b7280;
  font-size: 13px;
  margin-top: 4px;
}

@media (min-width: 600px) {
  .stats {
    grid-template-columns: repeat(4, 1fr);
  }
}
</style>
</head>

<body>

<header>⚡ Dex Go</header>

<div class="container">

  <!-- NAVIGATION -->
  <div class="nav">
    <button id="homeBtn" class="active" onclick="showSection('home')">
      🏠 Home
    </button>

    <button id="addBtn" onclick="showSection('add')">
      ➕ Add
    </button>

    <button id="collectionBtn" onclick="showSection('collection')">
      📦 Collection
    </button>
  </div>

  <!-- HOME -->
  <section id="home">

    <div class="card">
      <h2>📊 My Dex</h2>

      <div class="stats">

        <div class="stat">
          <div class="stat-number" id="totalCount">0</div>
          <div class="stat-label">Pokémon</div>
        </div>

        <div class="stat">
          <div class="stat-number" id="shinyCount">0</div>
          <div class="stat-label">✨ Shiny</div>
        </div>

        <div class="stat">
          <div class="stat-number" id="hundoCount">0</div>
          <div class="stat-label">💯 Hundo</div>
        </div>

        <div class="stat">
          <div class="stat-number" id="luckyCount">0</div>
          <div class="stat-label">🍀 Lucky</div>
        </div>

      </div>
    </div>

    <div class="card">
      <h2>⚡ Dex Go</h2>

      <p>
        Your personal Pokémon GO collection tracker.
      </p>

      <button class="primary" onclick="showSection('add')">
        ➕ Add Pokémon
      </button>
    </div>

  </section>

  <!-- ADD -->
  <section id="add" class="hidden">

    <div class="card">

      <h2>➕ Add Pokémon</h2>

      <div id="dexStatus" class="status">
        Loading Pokédex...
      </div>

      <label>Search Pokémon</label>

      <input
        id="pokemonSearch"
        type="text"
        placeholder="Search Pokémon or number..."
        oninput="filterPokemon()"
      >

      <label>Pokémon</label>

      <select id="pokemonSelect" onchange="selectPokemon()">
        <option value="">Loading Pokémon...</option>
      </select>

      <label>Pokédex #</label>

      <input
        id="pokedexNumber"
        type="text"
        readonly
        placeholder="Automatically selected"
      >

      <div class="row">

        <div>
          <label>CP</label>
          <input id="cp" type="number" placeholder="CP">
        </div>

        <div>
          <label>HP</label>
          <input id="hp" type="number" placeholder="HP">
        </div>

      </div>

      <h3>🧮 IVs</h3>

      <div class="row">

        <div>
          <label>ATK IV</label>
          <input
            id="atk"
            type="number"
            min="0"
            max="15"
            placeholder="0–15"
            oninput="calculateIV()"
          >
        </div>

        <div>
          <label>DEF IV</label>
          <input
            id="def"
            type="number"
            min="0"
            max="15"
            placeholder="0–15"
            oninput="calculateIV()"
          >
        </div>

      </div>

      <label>HP IV</label>

      <input
        id="hpiv"
        type="number"
        min="0"
        max="15"
        placeholder="0–15"
        oninput="calculateIV()"
      >

      <div class="iv-box">
        <div class="iv-title">Automatic IV %</div>
        <div class="iv-value" id="ivPercentage">0.0%</div>
      </div>

      <h3>⭐ Special Attributes</h3>

      <div class="checkbox-grid">

        <div class="checkbox-item">
          <label>
            <input id="shiny" type="checkbox">
            ✨ Shiny
          </label>
        </div>

        <div class="checkbox-item">
          <label>
            <input id="lucky" type="checkbox">
            🍀 Lucky
          </label>
        </div>

        <div class="checkbox-item">
          <label>
            <input id="hundo" type="checkbox">
            💯 Hundo
          </label>
        </div>

        <div class="checkbox-item">
          <label>
            <input id="dynamax" type="checkbox">
            🔵 Dynamax
          </label>
        </div>

        <div class="checkbox-item">
          <label>
            <input id="gigantamax" type="checkbox">
            🔴 Gigantamax
          </label>
        </div>

        <div class="checkbox-item">
          <label>
            <input id="shadow" type="checkbox">
            🌑 Shadow
          </label>
        </div>

        <div class="checkbox-item">
          <label>
            <input id="costume" type="checkbox">
            🎭 Costume
          </label>
        </div>

        <div class="checkbox-item">
          <label>
            <input id="event" type="checkbox">
            🎉 Event
          </label>
        </div>

      </div>

      <label>Background</label>
      <input id="background" type="text" placeholder="Background name">

      <h3>⚔️ Moves</h3>

      <label>Fast Attack</label>
      <input id="fastAttack" type="text" placeholder="Fast Attack">

      <label>Charged Attack 1</label>
      <input id="chargedAttack1" type="text" placeholder="Charged Attack 1">

      <label>Charged Attack 2</label>
      <input id="chargedAttack2" type="text" placeholder="Charged Attack 2">

      <label>Rarity /10</label>
      <input id="rarity" type="number" min="0" max="10" placeholder="0–10">

      <button class="success" onclick="savePokemon()">
        💾 Save Pokémon
      </button>

      <button class="secondary" onclick="clearForm()">
        🔄 Clear Form
      </button>

    </div>

  </section>

  <!-- COLLECTION -->
  <section id="collection" class="hidden">

    <div class="card">

      <h2>📦 My Pokémon</h2>

      <div id="pokemonList">
        <p class="status">No Pokémon saved yet.</p>
      </div>

    </div>

  </section>

</div>

<script>

let allPokemon = [];
let filteredPokemon = [];


// ==============================
// NAVIGATION
// ==============================

function showSection(section) {

  document.getElementById("home").classList.add("hidden");
  document.getElementById("add").classList.add("hidden");
  document.getElementById("collection").classList.add("hidden");

  document.getElementById("homeBtn").classList.remove("active");
  document.getElementById("addBtn").classList.remove("active");
  document.getElementById("collectionBtn").classList.remove("active");

  document.getElementById(section).classList.remove("hidden");

  if (section === "home") {
    document.getElementById("homeBtn").classList.add("active");
  }

  if (section === "add") {
    document.getElementById("addBtn").classList.add("active");
  }

  if (section === "collection") {
    document.getElementById("collectionBtn").classList.add("active");
    renderPokemon();
  }

  window.scrollTo(0, 0);
}


// ==============================
// IV CALCULATOR
// ==============================

function calculateIV() {

  const atk = Number(document.getElementById("atk").value) || 0;
  const def = Number(document.getElementById("def").value) || 0;
  const hp = Number(document.getElementById("hpiv").value) || 0;

  const total = atk + def + hp;

  const percentage = (total / 45) * 100;

  document.getElementById("ivPercentage").innerText =
    percentage.toFixed(1) + "%";
}


// ==============================
// LOAD POKÉDEX
// ==============================

async function loadPokedex() {

  const status = document.getElementById("dexStatus");

  try {

    const response = await fetch(
      "https://pokeapi.co/api/v2/pokemon-species?limit=1025&offset=0"
    );

    if (!response.ok) {
      throw new Error("Pokédex request failed");
    }

    const data = await response.json();

    allPokemon = data.results.map((pokemon, index) => {

      return {
        number: index + 1,
        name: formatName(pokemon.name)
      };

    });

    filteredPokemon = [...allPokemon];

    populatePokemonSelect();

    status.innerText =
      "✅ Pokédex loaded: 1,025 Pokémon";

  } catch (error) {

    console.error(error);

    status.innerText =
      "⚠️ Pokédex could not load. Check internet connection.";

    document.getElementById("pokemonSelect").innerHTML =
      '<option value="">Pokédex unavailable</option>';
  }
}


// ==============================
// FORMAT NAME
// ==============================

function formatName(name) {

  return name
    .split("-")
    .map(word =>
      word.charAt(0).toUpperCase() + word.slice(1)
    )
    .join(" ");
}


// ==============================
// POPULATE POKÉMON SELECT
// ==============================

function populatePokemonSelect() {

  const select =
    document.getElementById("pokemonSelect");

  select.innerHTML =
    '<option value="">Select Pokémon</option>';

  filteredPokemon.forEach(pokemon => {

    const option =
      document.createElement("option");

    option.value = pokemon.number;

    option.textContent =
      "#" +
      String(pokemon.number).padStart(3, "0") +
      " — " +
      pokemon.name;

    select.appendChild(option);
  });
}


// ==============================
// SEARCH
// ==============================

function filterPokemon() {

  const search =
    document.getElementById("pokemonSearch")
      .value
      .toLowerCase()
      .trim();

  if (search === "") {

    filteredPokemon = [...allPokemon];

  } else {

    filteredPokemon =
      allPokemon.filter(pokemon => {

        return (
          pokemon.name.toLowerCase().includes(search) ||
          String(pokemon.number).includes(search)
        );

      });
  }

  populatePokemonSelect();
}


// ==============================
// SELECT POKÉMON
// ==============================

function selectPokemon() {

  const number =
    Number(document.getElementById("pokemonSelect").value);

  const pokemon =
    allPokemon.find(p => p.number === number);

  if (!pokemon) {

    document.getElementById("pokedexNumber").value = "";

    return;
  }

  document.getElementById("pokedexNumber").value =
    "#" + String(pokemon.number).padStart(3, "0");
}


// ==============================
// SAVE
// ==============================

function savePokemon() {

  const number =
    Number(document.getElementById("pokemonSelect").value);

  const selected =
    allPokemon.find(p => p.number === number);

  if (!selected) {

    alert("Please select a Pokémon.");

    return;
  }

  const atk =
    Number(document.getElementById("atk").value) || 0;

  const def =
    Number(document.getElementById("def").value) || 0;

  const hpiv =
    Number(document.getElementById("hpiv").value) || 0;

  const iv =
    ((atk + def + hpiv) / 45) * 100;

  const pokemon = {

    id: Date.now(),

    name: selected.name,

    pokedexNumber: selected.number,

    cp: document.getElementById("cp").value,

    hp: document.getElementById("hp").value,

    atkIV: atk,

    defIV: def,

    hpIV: hpiv,

    ivPercentage: iv.toFixed(1),

    shiny: document.getElementById("shiny").checked,

    lucky: document.getElementById("lucky").checked,

    hundo: document.getElementById("hundo").checked,

    dynamax: document.getElementById("dynamax").checked,

    gigantamax: document.getElementById("gigantamax").checked,

    shadow: document.getElementById("shadow").checked,

    costume: document.getElementById("costume").checked,

    event: document.getElementById("event").checked,

    background: document.getElementById("background").value,

    fastAttack: document.getElementById("fastAttack").value,

    chargedAttack1:
      document.getElementById("chargedAttack1").value,

    chargedAttack2:
      document.getElementById("chargedAttack2").value,

    rarity:
      document.getElementById("rarity").value
  };


  let saved =
    JSON.parse(localStorage.getItem("dexGoPokemon")) || [];

  saved.push(pokemon);

  localStorage.setItem(
    "dexGoPokemon",
    JSON.stringify(saved)
  );

  alert(selected.name + " saved successfully! ⚡");

  clearForm();

  updateStats();

  showSection("collection");
}


// ==============================
// CLEAR FORM
// ==============================

function clearForm() {

  document.getElementById("pokemonSearch").value = "";

  document.getElementById("pokemonSelect").value = "";

  document.getElementById("pokedexNumber").value = "";

  document.getElementById("cp").value = "";

  document.getElementById("hp").value = "";

  document.getElementById("atk").value = "";

  document.getElementById("def").value = "";

  document.getElementById("hpiv").value = "";

  document.getElementById("ivPercentage").innerText = "0.0%";

  document.getElementById("shiny").checked = false;

  document.getElementById("lucky").checked = false;

  document.getElementById("hundo").checked = false;

  document.getElementById("dynamax").checked = false;

  document.getElementById("gigantamax").checked = false;

  document.getElementById("shadow").checked = false;

  document.getElementById("costume").checked = false;

  document.getElementById("event").checked = false;

  document.getElementById("background").value = "";

  document.getElementById("fastAttack").value = "";

  document.getElementById("chargedAttack1").value = "";

  document.getElementById("chargedAttack2").value = "";

  document.getElementById("rarity").value = "";
}


// ==============================
// STATS
// ==============================

function updateStats() {

  const saved =
    JSON.parse(localStorage.getItem("dexGoPokemon")) || [];

  document.getElementById("totalCount").innerText =
    saved.length;

  document.getElementById("shinyCount").innerText =
    saved.filter(p => p.shiny).length;

  document.getElementById("hundoCount").innerText =
    saved.filter(p => p.hundo).length;

  document.getElementById("luckyCount").innerText =
    saved.filter(p => p.lucky).length;
}


// ==============================
// COLLECTION
// ==============================

function renderPokemon() {

  const container =
    document.getElementById("pokemonList");

  const saved =
    JSON.parse(localStorage.getItem("dexGoPokemon")) || [];

  if (saved.length === 0) {

    container.innerHTML =
      '<p class="status">No Pokémon saved yet.</p>';

    return;
  }

  container.innerHTML = "";

  saved.forEach(pokemon => {

    const card =
      document.createElement("div");

    card.className = "pokemon-card";

    let badges = "";

    if (pokemon.shiny)
      badges += '<span class="badge">✨ Shiny</span>';

    if (pokemon.lucky)
      badges += '<span class="badge">🍀 Lucky</span>';

    if (pokemon.hundo)
      badges += '<span class="badge">💯 Hundo</span>';

    if (pokemon.dynamax)
      badges += '<span class="badge">🔵 Dynamax</span>';

    if (pokemon.gigantamax)
      badges += '<span class="badge">🔴 Gigantamax</span>';

    if (pokemon.shadow)
      badges += '<span class="badge">🌑 Shadow</span>';

    if (pokemon.costume)
      badges += '<span class="badge">🎭 Costume</span>';

    if (pokemon.event)
      badges += '<span class="badge">🎉 Event</span>';

    card.innerHTML = `
      <h3>
        #${String(pokemon.pokedexNumber).padStart(3, "0")}
        — ${pokemon.name}
      </h3>

      <div class="small">
        CP: ${pokemon.cp || "-"}
        |
        HP: ${pokemon.hp || "-"}
      </div>

      <div class="small">
        IV:
        ${pokemon.atkIV}/${pokemon.defIV}/${pokemon.hpIV}
        —
        ${pokemon.ivPercentage}%
      </div>

      <div class="badges">
        ${badges}
      </div>
    `;

    container.appendChild(card);
  });
}


// ==============================
// START
// ==============================

updateStats();

renderPokemon();

loadPokedex();

</script>

</body>
</html>
