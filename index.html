<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Collection</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #e3350d;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin-top: 15px;
      border-radius: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #e3350d;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

<header>
  <h1>🎮 Pokémon Collection</h1>
  <p>My Pokémon Tracker</p>
</header>

<div class="container">

  <div class="card">
    <h2>📊 My Collection</h2>
    <p>Pokémon: 0</p>
    <p>Shiny: 0</p>
    <p>Hundo: 0</p>
    <p>Lucky: 0</p>
  </div>

  <div class="card">
    <h2>🏆 Collection</h2>
    <button>➕ Add Pokémon</button>
    <button>📖 Pokédex</button>
    <button>💎 Best / Rare</button>
  </div>

</div>

</body>
</html>
